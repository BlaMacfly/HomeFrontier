[package]
name = "frontier-solo-launcher"
version = "0.1.0"
edition = "2024"
description = "HomeFrontier — launcher du serveur local Monster Hunter Frontier ZZ solo"

[dependencies]
anyhow = "1"
crc32fast = "1"
eframe = "0.32"
encoding_rs = "0.8"
getrandom = "0.3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"
